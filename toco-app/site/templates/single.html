<main class="single-main">
    <article class="single-article page-width">
        <header class="single-header">
            <a class="single-category" href="/category/{{CATSLUG}}/">{{CATNAME}}</a>
            <h1>{{TITLE}}</h1>
            <time datetime="{{DATEISO}}">{{DATE}}</time>
        </header>
        {{HERO}}
        <div class="entry-content">{{TOC}}
{{BODY}}</div>
        <nav class="post-navigation" aria-label="記事ナビゲーション">
            <div class="nav-links">{{PREV}}{{NEXT}}</div>
        </nav>
    </article>
</main>
