<main class="archive-main page-width">
    <header class="archive-header">
        <h1 id="search-heading">検索結果</h1>
        <form class="search-page-form" role="search" method="get" action="/search/">
            <label class="screen-reader-text" for="search-page-input">キーワード</label>
            <input id="search-page-input" type="search" name="q" placeholder="キーワードを入力" autocomplete="off">
            <button type="submit">検索</button>
        </form>
        <p class="search-summary" id="search-summary" role="status"></p>
    </header>
    <div class="archive-grid" id="search-results"></div>
    <div class="search-note" id="search-note" hidden>
        <p id="search-note-text">別のことばで探すか、カテゴリから見てみてください。</p>
        <div class="search-cats">{{CATLINKS}}</div>
    </div>
</main>
